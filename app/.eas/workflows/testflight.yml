name: Test and build mobile releases

on:
  push:
    branches:
      - main
      - codex/mobile-tracking
    paths:
      - app/**
      - '!app/**/*.md'

jobs:
  test:
    name: Mobile tests and types
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run typecheck
      - run: npm test -- --runInBand
  build_ios:
    name: Build standalone iPhone app
    needs: [test]
    type: build
    params:
      platform: ios
      profile: testflight
  build_android:
    name: Build Android for Google Play internal testing
    needs: [test]
    type: build
    params:
      platform: android
      profile: android-testing
  # Android bundles are uploaded through Play Console until a Google Play
  # submission service account is configured in EAS. See app/README.md.
  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: testflight
