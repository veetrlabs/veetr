name: Test, build and submit mobile releases

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - '!app/**/*.md'

jobs:
  test:
    name: Mobile tests and types
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: node --test tests/android-config.test.cjs
  build_ios:
    name: Build standalone iPhone app
    needs: [test]
    type: build
    params:
      platform: ios
      profile: testflight
  build_android:
    name: Build Android for Google Play internal testing
    needs: [test]
    type: build
    params:
      platform: android
      profile: android-testing
  submit_android:
    name: Submit to Google Play internal testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: android-testing
  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: testflight
