name: Website checks

on:
  push:
    branches: [main]
    paths: ['veetr.org/**', 'veetr.com/**', 'pwa/**', 'docs/**', 'packages/**', 'supabase/**', 'package*.json', '.github/workflows/site-checks.yml']
  pull_request:
    paths: ['veetr.org/**', 'veetr.com/**', 'pwa/**', 'docs/**', 'packages/**', 'supabase/**', 'package*.json', '.github/workflows/site-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run test:race
      - run: npm run test --workspace veetr.org
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npm run build --workspace pwa
