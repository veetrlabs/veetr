name: Deploy sailing PWA
on:
  push:
    branches: [main]
    paths: ['pwa/**', 'packages/shared/**', 'package*.json', '.github/workflows/deploy-pwa.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pwa-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace veetr
      - run: node pwa/scripts/prepare-firmware.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/dist
      - uses: actions/deploy-pages@v4
        id: deployment
